<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inscrição para a membresia</title>
    <link rel="stylesheet" href="membresia.css">
</head>

<body>
    
   
    <div class="membresia.container">

        <hl>INSCRIÇÃO PARA MEMBRESIA</hl>
        <form>
            <input type="text" nome="name" placeholder="Nome completo"required>

             <input type="date" nome="date" placeholder="00/00/00" pattern=" `^((0[1-9]" required>
             
             <input type="text" nome="endereco" placeholder="Endereço"required>
             <input type="text"nome="cpf" placeholder="CPF" maxlength="11" required>
             <input type="tel" nome="telefone"placeholder="(99) 99999-9999"pattern="\(\d{2}\)\s\d{4,5}-\d{4}"maxlength="11"required>
            <input type="email" nome="username" placeholder="Email"required>
            <input type="passport" nome ="passport"placeholder="Senha"requerid>
            
            <input type="submit" value ="INSCREVA-SE">


        </form>
        
        
    </div>
</body>

</html>
